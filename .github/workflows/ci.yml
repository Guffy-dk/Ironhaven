name: Test and build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ./scripts/build-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Ironhaven-Windows-preview
          path: release/Ironhaven-*.png

      - name: Record internal build identity
        run: |
          node --input-type=module -e "import {writeFileSync} from 'node:fs'; import {CURRENT_VERSION,INTERNAL_BUILD} from './public/shared/releases.js'; writeFileSync('release/Ironhaven-internal-build.json',JSON.stringify({version:CURRENT_VERSION,buildId:INTERNAL_BUILD,sourceCommit:process.env.GITHUB_SHA},null,2))"

      - name: Keep the verified Windows build for internal playtesting
        uses: actions/upload-artifact@v4
        with:
          name: Ironhaven-Windows-internal-build
          retention-days: 14
          path: |
            release/Ironhaven-Windows-x64.zip
            release/Ironhaven-Windows-manifest.json
            release/Ironhaven-internal-build.json
