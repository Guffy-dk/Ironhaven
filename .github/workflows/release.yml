name: Release Windows game
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: ./scripts/build-windows.ps1
      - name: Publish Windows game and patcher
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -eq 'v0.21.1') {
            gh release download v0.20.1 --pattern Ironhaven-Patcher.exe --dir release --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve the existing patcher.' }
          }
          gh release create "$env:RELEASE_TAG" release/Ironhaven-Windows-x64.zip release/Ironhaven-Patcher.exe release/Ironhaven-Windows-manifest.json release/Ironhaven-ingame.png release/Ironhaven-creatures.png release/Ironhaven-island.png release/Ironhaven-settings.png release/Ironhaven-menu.png release/Ironhaven-ports.png release/Ironhaven-harbor.png --latest=false --title "Ironhaven $env:RELEASE_TAG Windows Playtest" --notes-file release/RELEASE_NOTES.md --verify-tag

      - name: Verify published installation and promote patcher update
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tests = Join-Path $PWD "release/windows-$version/PatcherTests.exe"
          $verified = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            & $tests "$env:RELEASE_TAG" --exact
            if ($LASTEXITCODE -eq 0) { $verified = $true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds 3 }
          }
          if (!$verified) { throw 'Published Windows installation did not verify; latest patcher release was not changed.' }
          gh release edit "$env:RELEASE_TAG" --latest
